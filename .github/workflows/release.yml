name: Validate and release Android

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - name: Audit source and run regression checks
        run: |
          python3 tools/audit_public_tree.py
          python3 tools/verify_dual_storage.py
          python3 -m unittest discover -s tools -p "test_*.py"
          sh gradlew :core:test :app:testDebugUnitTest :app:lintDebug :app:assemblePreview :app:assembleRelease :app:assembleDebugAndroidTest --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports
          path: |
            core/build/reports/
            app/build/reports/
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=30
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Android storage and widget regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          avd-name: usagetime-qa-regression
          script: sh gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=dev.usagetime.app.InsightsStorageTest,dev.usagetime.app.BackupStreamReaderTest,dev.usagetime.app.BackupStreamWriterTest,dev.usagetime.app.HistoryRetentionTest,dev.usagetime.app.StatisticsQueryTest --console=plain

  signing:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check signing secrets
        id: check
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Android signing secrets are not configured; release job will be skipped."
          fi

  release:
    if: startsWith(github.ref, 'refs/tags/v') && needs.signing.outputs.ready == 'true'
    needs: [validate, signing]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore stable signing identity
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/release.jks"
      - run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - name: Build with stable signing identity
        env:
          USAGETIME_KEYSTORE_PATH: ${{ runner.temp }}/signing/release.jks
          USAGETIME_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          USAGETIME_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          USAGETIME_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: sh gradlew :app:assembleRelease --console=plain
      - name: Download previous official APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')
          test -n "$previous"
          test "$previous" != "$GITHUB_REF_NAME"
          if [ "$GITHUB_REF_NAME" = v0.4.12 ] && [ "$previous" != v0.4.11 ]; then
            echo "::error::v0.4.12 must be cover-installed over the v0.4.11 official release."
            exit 1
          fi
          gh release download "$previous" --pattern '*.apk' --dir "$RUNNER_TEMP/previous"
      - name: Verify release build, signing and version progression
        run: |
          old=$(find "$RUNNER_TEMP/previous" -name '*.apk' -print -quit)
          new=app/build/outputs/apk/release/app-release.apk
          aapt="$ANDROID_HOME/build-tools/37.0.0/aapt"
          "$aapt" dump badging "$new" > "$RUNNER_TEMP/new-badging"
          if grep -q '^application-debuggable$' "$RUNNER_TEMP/new-badging"; then
            echo "::error::The public APK must be non-debuggable."
            exit 1
          fi
          signer="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          "$signer" verify --print-certs "$old" | grep 'certificate SHA-256 digest' > "$RUNNER_TEMP/old-cert"
          "$signer" verify --print-certs "$new" | grep 'certificate SHA-256 digest' > "$RUNNER_TEMP/new-cert"
          diff "$RUNNER_TEMP/old-cert" "$RUNNER_TEMP/new-cert"
          old_code=$("$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$old" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)
          new_code=$(sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" "$RUNNER_TEMP/new-badging" | head -1)
          test "$new_code" -gt "$old_code"
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=30
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Cover-install previous version with synthetic history
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          avd-name: usagetime-qa-release
          script: python3 tools/upgrade_check.py --serial emulator-5554 --root-adb --old-apk "$(find "$RUNNER_TEMP/previous" -name '*.apk' -print -quit)" --new-apk app/build/outputs/apk/release/app-release.apk --output artifacts/upgrade-check.json
      - name: Package audited source and checksums
        run: |
          python3 tools/release_package.py --apk app/build/outputs/apk/release/app-release.apk --output artifacts/release --tag "$GITHUB_REF_NAME"
          cp artifacts/upgrade-check.json artifacts/release/
          (cd artifacts/release && sha256sum upgrade-check.json >> SHA256SUMS.txt)
      - name: Publish official latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" artifacts/release/* --verify-tag --title "用时记 $version" --notes-file "docs/RELEASE-$version.md" --draft
          gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease=false --latest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upgrade-check
          path: artifacts/upgrade-check.json
